/* =====================================
   SETTINGS
===================================== */

/*
   ROUND1
   47人 × 2回 = 94登場枠

   4人ずつのため、
   24試合 = 96登場枠。

   最低2回を保証し、
   余った2枠はランダム追加。
*/

const ROUND1_GAMES = 24;


/*
   ROUND2
   ROUND1の結果を使って絞る
*/

const ROUND2_GAMES = 20;


/*
   ROUND3
   ROUND1で一度も選ばれなかった人を
   必ず最低1回登場させる。

   さらにROUND1で2回選ばれた人を
   メインにする。
*/

const ROUND3_GAMES = 24;


/*
   ROUND4
   最終18人を2人対決。

   18人 × 6回 = 108登場枠
   108 ÷ 2 = 54試合
*/

const ROUND4_GAMES = 54;


/* =====================================
   VARIABLES
===================================== */

let round = 1;
let gameNumber = 0;

let currentCandidates = [];
let selected = [];

let round1Appearances = {};
let round1Selected = {};

let round2Selected = {};
let round3Selected = {};

let round4Wins = {};

let round1Groups = [];
let round2Groups = [];
let round3Groups = [];

let round2Pool = [];
let round3Pool = [];

let final18 = [];
let finalMatchups = [];


/* =====================================
   SHUFFLE
===================================== */

function shuffle(array) {

  const result = [...array];

  for(
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}


/* =====================================
   START
===================================== */

function startGame() {

  round = 1;
  gameNumber = 0;

  currentCandidates = [];
  selected = [];

  round1Groups = [];
  round2Groups = [];
  round3Groups = [];

  round2Pool = [];
  round3Pool = [];

  final18 = [];
  finalMatchups = [];

  round1Appearances = {};
  round1Selected = {};
  round2Selected = {};
  round3Selected = {};
  round4Wins = {};


  members.forEach(member => {

    round1Appearances[member.name] = 0;
    round1Selected[member.name] = 0;
    round2Selected[member.name] = 0;
    round3Selected[member.name] = 0;
    round4Wins[member.name] = 0;

  });


  document
    .getElementById("startScreen")
    .classList
    .remove("active");

  document
    .getElementById("resultScreen")
    .classList
    .remove("active");

  document
    .getElementById("gameScreen")
    .classList
    .add("active");


  /*
     ★ ROUND1の全グループを先に作る
  */

  createRound1Groups();

  showNextGame();

}


/* =====================================
   ROUND1 GROUPS
===================================== */

function createRound1Groups() {

  let slots = [];

  /*
     全員2回ずつ
  */

  members.forEach(member => {

    slots.push(member);
    slots.push(member);

  });


  /*
     94枠 → 96枠にするため
     ランダムな2人を追加
  */

  const extra =
    shuffle(members).slice(0,2);

  extra.forEach(member => {

    slots.push(member);

  });


  /*
     4人グループを作る
  */

  let attempts = 0;

  while(attempts < 500) {

    attempts++;

    const shuffled =
      shuffle(slots);

    let groups = [];
    let valid = true;

    for(
      let i = 0;
      i < shuffled.length;
      i += 4
    ) {

      const group =
        shuffled.slice(i,i+4);

      /*
         同じ人が同じ試合に
         2回入らないようにする
      */

      const names =
        group.map(x => x.name);

      if(
        new Set(names).size !== 4
      ) {

        valid = false;
        break;

      }

      groups.push(group);

    }

    if(valid) {

      round1Groups = groups;

      groups.forEach(group => {

        group.forEach(member => {

          round1Appearances[
            member.name
          ]++;

        });

      });

      return;

    }

  }

  /*
     万一調整できなかった場合の保険
  */

  round1Groups = [];

  let backup =
    shuffle(slots);

  for(
    let i = 0;
    i < backup.length;
    i += 4
  ) {

    round1Groups.push(
      backup.slice(i,i+4)
    );

  }

}


/* =====================================
   WEIGHTED RANDOM
===================================== */

function weightedRandom(
  pool,
  scoreFunction
) {

  let total = 0;

  pool.forEach(member => {

    total +=
      scoreFunction(member) + 1;

  });


  let random =
    Math.random() * total;


  for(const member of pool) {

    random -=
      scoreFunction(member) + 1;

    if(random <= 0) {

      return member;

    }

  }


  return pool[
    Math.floor(
      Math.random() * pool.length
    )
  ];

}


/* =====================================
   ROUND2
===================================== */

function createRound2Groups() {

  let pool = [];


  /*
     全員を一度は候補に入れる
  */

  members.forEach(member => {

    pool.push(member);

  });


  /*
     ROUND1で選ばれた人を追加。

     選ばれた回数が多いほど
     ROUND2に出やすくする。
  */

  members.forEach(member => {

    const count =
      round1Selected[member.name];

    for(
      let i = 0;
      i < count;
      i++
    ) {

      pool.push(member);

    }

  });


  round2Pool = pool;


  for(
    let game = 0;
    game < ROUND2_GAMES;
    game++
  ) {

    let group = [];

    let safety = 0;

    while(
      group.length < 4 &&
      safety < 1000
    ) {

      safety++;

      const person =
        weightedRandom(
          round2Pool,
          member =>
            round1Selected[
              member.name
            ]
        );

      if(
        person &&
        !group.some(
          x => x.name === person.name
        )
      ) {

        group.push(person);

      }

    }

    round2Groups.push(group);

  }

}


/* =====================================
   ROUND3
===================================== */

function createRound3Groups() {

  /*
     ROUND1で一度も選ばれなかった人
  */

  const neverSelected =
    members.filter(member =>
      round1Selected[member.name] === 0
    );


  /*
     ROUND1で2回とも選ばれた人
  */

  const twiceSelected =
    members.filter(member =>
      round1Selected[member.name] >= 2
    );


  /*
     まず「未選出メンバー」を
     必ず1回以上登場させる。

     24試合 × 4人 = 96枠あるので
     全員保証できる。
  */

  let groups = [];

  let forcedSlots =
    shuffle(neverSelected);


  /*
     メイン候補を大量に用意
  */

  let mainPool = [];

  twiceSelected.forEach(member => {

    /*
       2回選ばれた人ほど
       ROUND3で何度も出やすくする
    */

    for(
      let i = 0;
      i < 4;
      i++
    ) {

      mainPool.push(member);

    }

  });


  /*
     一度だけ選ばれた人も
     少しだけ候補に入れる
  */

  members
    .filter(member =>
      round1Selected[member.name] === 1
    )
    .forEach(member => {

      mainPool.push(member);
      mainPool.push(member);

    });


  /*
     未選出メンバーも
     保証分以外では少し登場可能
  */

  neverSelected.forEach(member => {

    mainPool.push(member);

  });


  /*
     96枠を作る
  */

  let slots = [];


  /*
     まず未選出を1回ずつ確保
  */

  forcedSlots.forEach(member => {

    slots.push(member);

  });


  /*
     残りをメイン候補中心で埋める
  */

  while(slots.length < ROUND3_GAMES * 4) {

    const person =
      weightedRandom(
        mainPool,
        member => {

          if(
            round1Selected[member.name] >= 2
          ) {

            return 10;

          }

          if(
            round1Selected[member.name] === 1
          ) {

            return 4;

          }

          return 1;

        }
      );

    if(person) {

      slots.push(person);

    }

  }


  /*
     同じ試合に同じ人が
     入らないようにする
  */

  for(
    let attempt = 0;
    attempt < 1000;
    attempt++
  ) {

    const shuffled =
      shuffle(slots);

    let valid = true;
    let testGroups = [];

    for(
      let i = 0;
      i < shuffled.length;
      i += 4
    ) {

      const group =
        shuffled.slice(i,i+4);

      const names =
        group.map(x => x.name);

      if(
        new Set(names).size !== 4
      ) {

        valid = false;
        break;

      }

      testGroups.push(group);

    }

    if(valid) {

      groups = testGroups;
      break;

    }

  }


  /*
     もし調整できなかった場合
  */

  if(groups.length === 0) {

    const backup =
      shuffle(slots);

    for(
      let i = 0;
      i < backup.length;
      i += 4
    ) {

      groups.push(
        backup.slice(i,i+4)
      );

    }

  }


  round3Groups = groups;

}


/* =====================================
   FINAL 18
===================================== */

function createFinal18() {

  /*
     ROUND1で2回選ばれた人を
     強く評価。

     ROUND3の選択も加える。
  */

  return [...members]
    .sort((a,b) => {

      const scoreA =
        round1Selected[a.name] * 5 +
        round2Selected[a.name] * 2 +
        round3Selected[a.name] * 4;

      const scoreB =
        round1Selected[b.name] * 5 +
        round2Selected[b.name] * 2 +
        round3Selected[b.name] * 4;


      if(scoreA === scoreB) {

        return Math.random() - 0.5;

      }

      return scoreB - scoreA;

    })
    .slice(0,18);

}


/* =====================================
   ROUND4 MATCHES
===================================== */

function createRound4Matches() {

  let slots = [];


  /*
     18人全員6回
  */

  final18.forEach(member => {

    for(
      let i = 0;
      i < 6;
      i++
    ) {

      slots.push(member);

    }

  });


  /*
     同じ人同士にならないようにする
  */

  for(
    let attempt = 0;
    attempt < 5000;
    attempt++
  ) {

    const shuffled =
      shuffle(slots);

    let valid = true;

    for(
      let i = 0;
      i < shuffled.length;
      i += 2
    ) {

      if(
        shuffled[i].name ===
        shuffled[i+1].name
      ) {

        valid = false;
        break;

      }

    }

    if(valid) {

      let matches = [];

      for(
        let i = 0;
        i < shuffled.length;
        i += 2
      ) {

        matches.push([
          shuffled[i],
          shuffled[i+1]
        ]);

      }

      return matches;

    }

  }


  /*
     保険
  */

  let matches = [];

  let backup =
    shuffle(slots);

  for(
    let i = 0;
    i < backup.length;
    i += 2
  ) {

    if(
      backup[i+1]
    ) {

      matches.push([
        backup[i],
        backup[i+1]
      ]);

    }

  }

  return matches;

}


/* =====================================
   SHOW GAME
===================================== */

function showNextGame() {

  selected = [];


  if(round === 1) {

    currentCandidates =
      round1Groups[gameNumber];

  }

  else if(round === 2) {

    currentCandidates =
      round2Groups[gameNumber];

  }

  else if(round === 3) {

    currentCandidates =
      round3Groups[gameNumber];

  }

  else {

    currentCandidates =
      finalMatchups[gameNumber];

  }


  document
    .getElementById("members")
    .innerHTML = "";


  document
    .getElementById("nextButton")
    .style.display = "none";


  if(round === 4) {

    document
      .getElementById("progress")
      .textContent =
      `FINAL　${gameNumber + 1} / ${ROUND4_GAMES}`;


    document
      .getElementById("question")
      .textContent =
      "この2人なら、顔が好きなのはどっち？♡";

  }

  else {

    const total =
      round === 1
        ? ROUND1_GAMES
        : round === 2
          ? ROUND2_GAMES
          : ROUND3_GAMES;


    document
      .getElementById("progress")
      .textContent =
      `ROUND ${round}　${gameNumber + 1} / ${total}`;


    document
      .getElementById("question")
      .textContent =
      "この4人から好きな2人を選んでね♡";

  }


  currentCandidates.forEach(
    (member,index) => {

      const element =
        document.createElement("div");


      element.className =
        "member";


      element.onclick =
        function() {

          toggleMember(
            element,
            index
          );

        };


      element.innerHTML = `

        ${createPhotoHTML(
          member,
          "photo"
        )}

        <div class="member-name">
          ${member.name}
        </div>

        <div class="member-gen">
          ${member.gen}
        </div>

      `;


      document
        .getElementById("members")
        .appendChild(element);

    }
  );

}


/* =====================================
   PHOTO
===================================== */

function createPhotoHTML(
  member,
  className
) {

  const file =
    photoFiles[member.name];


  if(!file) {

    return `
      <div class="${className}">
        ${member.name.charAt(0)}
      </div>
    `;

  }


  const url =
    encodeURI("./" + file);


  return `

    <div class="${className}">

      <img
        src="${url}"
        alt="${member.name}"
        onerror="this.style.display='none'; this.parentElement.innerHTML='📷';"
      >

    </div>

  `;

}


/* =====================================
   SELECT
===================================== */

function toggleMember(
  element,
  index
) {

  const limit =
    round === 4
      ? 1
      : 2;


  if(selected.includes(index)) {

    selected =
      selected.filter(
        i => i !== index
      );


    element
      .classList
      .remove("selected");

  }

  else {

    if(
      selected.length >= limit
    ) {

      return;

    }


    selected.push(index);


    element
      .classList
      .add("selected");

  }


  document
    .getElementById("nextButton")
    .style.display =
      selected.length === limit
        ? "block"
        : "none";

}


/* =====================================
   CONFIRM
===================================== */

function confirmSelection() {


  /* ===============================
     ROUND 1
  =============================== */

  if(round === 1) {

    selected.forEach(index => {

      const member =
        currentCandidates[index];


      round1Selected[
        member.name
      ]++;

    });


    gameNumber++;


    if(
      gameNumber >=
      ROUND1_GAMES
    ) {

      createRound2Groups();

      round = 2;
      gameNumber = 0;

    }


    showNextGame();

    return;

  }


  /* ===============================
     ROUND 2
  =============================== */

  if(round === 2) {

    selected.forEach(index => {

      const member =
        currentCandidates[index];


      round2Selected[
        member.name
      ]++;

    });


    gameNumber++;


    if(
      gameNumber >=
      ROUND2_GAMES
    ) {

      createRound3Groups();

      round = 3;
      gameNumber = 0;

    }


    showNextGame();

    return;

  }


  /* ===============================
     ROUND 3
  =============================== */

  if(round === 3) {

    selected.forEach(index => {

      const member =
        currentCandidates[index];


      round3Selected[
        member.name
      ]++;

    });


    gameNumber++;


    if(
      gameNumber >=
      ROUND3_GAMES
    ) {

      final18 =
        createFinal18();


      finalMatchups =
        createRound4Matches();


      round = 4;
      gameNumber = 0;

    }


    showNextGame();

    return;

  }


  /* ===============================
     ROUND 4
  =============================== */

  if(round === 4) {

    const winner =
      currentCandidates[
        selected[0]
      ];


    round4Wins[
      winner.name
    ]++;


    gameNumber++;


    if(
      gameNumber >=
      ROUND4_GAMES
    ) {

      showFinalResult();

      return;

    }


    showNextGame();

  }

}


/* =====================================
   FINAL RESULT
===================================== */

function showFinalResult() {

  const ranking =
    [...final18]
      .sort((a,b) => {

        const winsA =
          round4Wins[a.name];

        const winsB =
          round4Wins[b.name];


        if(winsA === winsB) {

          const scoreA =
            round1Selected[a.name] * 5 +
            round2Selected[a.name] * 2 +
            round3Selected[a.name] * 4;

          const scoreB =
            round1Selected[b.name] * 5 +
            round2Selected[b.name] * 2 +
            round3Selected[b.name] * 4;


          if(scoreA === scoreB) {

            return Math.random() - 0.5;

          }


          return scoreB - scoreA;

        }


        return winsB - winsA;

      });


  const top9 =
    ranking.slice(0,9);


  document
    .getElementById("gameScreen")
    .classList
    .remove("active");


  document
    .getElementById("resultScreen")
    .classList
    .add("active");


  const displayOrder = [

    top9[3],
    top9[4],
    top9[5],

    top9[1],
    top9[0],
    top9[2],

    top9[6],
    top9[7],
    top9[8]

  ];


  const numbers = [

    4,5,6,
    2,1,3,
    7,8,9

  ];


  const grid =
    document.getElementById(
      "resultGrid"
    );


  grid.innerHTML = "";


  displayOrder.forEach(
    (member,index) => {

      const card =
        document.createElement("div");


      card.className =
        "final-card";


      card.innerHTML = `

        ${createPhotoHTML(
          member,
          "final-photo"
        )}

        <div class="final-number">
          ${numbers[index]}
        </div>

        <div class="final-name">
          ${member.name}
        </div>

        <div class="final-gen">
          ${member.gen}
        </div>

      `;


      grid.appendChild(card);

    }
  );


  const rankList =
    document.getElementById(
      "rankList"
    );


  rankList.innerHTML = "";


  ranking.forEach(
    (member,index) => {

      const row =
        document.createElement("div");


      row.className =
        "rank-row";


      row.innerHTML = `

        <div class="rank-number">
          ${index + 1}位
        </div>

        <div class="rank-name">
          ${member.name}
        </div>

        <div class="rank-wins">
          ${round4Wins[member.name]}勝
        </div>

      `;


      rankList.appendChild(row);

    }
  );

}

</script>
