<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DMD SUKIGAO 9</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff9fc;
      color: #30252d;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 50px;
    }

    .card {
      background: white;
      border: 1px solid #ead8e3;
      border-radius: 32px;
      padding: 45px 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(170, 90, 130, 0.08);
    }

    .small-title {
      color: #a36b88;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.25;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 30px;
      font-size: 20px;
      line-height: 1.8;
      font-weight: bold;
    }

    .heart {
      color: #e98ab5;
    }

    .description {
      margin-top: 35px;
      color: #887580;
      font-size: 17px;
      line-height: 2;
    }

    .intro-box {
      margin-top: 35px;
      padding: 25px 20px;
      background: #fff0f7;
      border: 1px solid #efd3e1;
      border-radius: 25px;
      text-align: left;
    }

    .intro-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .intro-text {
      color: #6f6269;
      line-height: 1.8;
      font-size: 15px;
    }

    .start-button {
      width: 100%;
      margin-top: 35px;
      padding: 20px;
      border: none;
      border-radius: 18px;
      background: #b84f87;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(184, 79, 135, 0.2);
    }

    .start-button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 25px;
      color: #aaa0a6;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="small-title">
        DMD SUKIGAO 9
      </div>

      <h1>
        DMD<br>
        好き顔9選メーカー
      </h1>

      <div class="subtitle">
        DMDメンバーから、あなたの<br>
        「顔が好き」TOP9を決めよう
        <span class="heart">💗</span>
      </div>

      <div class="description">
        推しランキングじゃなくて、<br>
        顔だけで直感勝負！
      </div>

      <div class="intro-box">

        <div class="intro-title">
          🌱 予選
        </div>

        <div class="intro-text">
          表示されたDMDメンバーの中から、<br>
          顔が好きな人を選んでね。<br>
          複数選択OK！
        </div>

      </div>

      <button class="start-button" onclick="startGame()">
        はじめる 💗
      </button>

      <div class="note">
        深く考えず、直感で選んでね。
      </div>

    </section>

  </main>

  <script>
    function startGame() {
      alert("ここからDMD好き顔9選が始まるよ💗");
    }
  </script>

</body>
</html>
