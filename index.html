<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMD SUKIGAO 9</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  background: #fff8fc;
  color: #30252d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}
.container {
  width: min(100%, 900px);
  margin: 0 auto;
  padding: 30px 18px 50px;
  text-align: center;
}
h1 {
  margin: 10px 0 8px;
  font-size: 30px;
  letter-spacing: 1px;
}
.subtitle {
  margin: 0 0 25px;
  color: #9a8290;
  font-size: 14px;
}
.screen {
  display: none;
}
.screen.active {
  display: block;
}
.start-box {
  padding: 45px 20px;
}
.start-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 12px;
}
.start-text {
  color: #806d77;
  line-height: 1.8;
  margin-bottom: 30px;
}
button {
  border: none;
  cursor: pointer;
  font-family: inherit;
}
.start-button,
.retry-button {
  background: #30252d;
  color: white;
  border-radius: 999px;
  padding: 15px 45px;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 5px 15px rgba(48,37,45,0.15);
}
.start-button:active,
.retry-button:active {
  transform: scale(0.97);
}
.question {
  font-size: 20px;
  font-weight: bold;
  margin: 15px 0 20px;
}
.progress {
  color: #a68d9a;
  font-size: 13px;
  margin-bottom: 18px;
}
.choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.choice {
  background: white;
  border: 2px solid #f0e3ea;
  border-radius: 18px;
  padding: 10px;
  transition: 0.15s;
  box-shadow: 0 3px 12px rgba(80,50,70,0.06);
}
.choice:hover {
  border-color: #d7b9ca;
  transform: translateY(-2px);
}
.choice:active {
  transform: scale(0.98);
}
.choice img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 13px;
  background: #f5edf2;
}
.choice-name {
  font-size: 16px;
  font-weight: bold;
  margin: 10px 0 4px;
}
.choice-number {
  color: #b49daa;
  font-size: 11px;
}
.duel-title {
  font-size: 23px;
  font-weight: bold;
  margin: 12px 0 8px;
}
.duel-subtitle {
  color: #9a8290;
  font-size: 13px;
  margin-bottom: 20px;
}
.duel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.duel-card {
  background: white;
  border: 2px solid #f0e3ea;
  border-radius: 20px;
  padding: 12px;
  box-shadow: 0 4px 15px rgba(80,50,70,0.07);
  transition: 0.15s;
}
.duel-card:hover {
  border-color: #d7b9ca;
  transform: translateY(-2px);
}
.duel-card img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 15px;
  background: #f5edf2;
}
.duel-name {
  font-weight: bold;
  font-size: 18px;
  margin-top: 11px;
}
.duel-number {
  color: #b49daa;
  font-size: 11px;
  margin-top: 3px;
}
.result-title {
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 8px;
}
.result-subtitle {
  color: #9a8290;
  margin-bottom: 25px;
}
.final-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
  margin-bottom: 30px;
}
.final-card {
  background: white;
  border-radius: 18px;
  padding: 9px;
  box-shadow: 0 4px 15px rgba(80,50,70,0.08);
}
.final-card img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 13px;
  background: #f5edf2;
}
.final-rank {
  font-size: 13px;
  color: #b18c9f;
  margin-top: 8px;
}
.final-name {
  font-size: 15px;
  font-weight: bold;
  margin-top: 3px;
}
.notice {
  min-height: 20px;
  color: #b46f8f;
  font-size: 12px;
  margin-top: 10px;
}
@media (max-width: 520px) {
  .container {
    padding: 22px 12px 40px;
  }
  h1 {
    font-size: 25px;
  }
  .question {
    font-size: 18px;
  }
  .choices {
    gap: 9px;
  }
  .choice {
    border-radius: 14px;
    padding: 7px;
  }
  .choice-name {
    font-size: 14px;
    margin-top: 7px;
  }
  .duel {
    gap: 10px;
  }
  .duel-card {
    padding: 8px;
    border-radius: 15px;
  }
  .duel-name {
    font-size: 15px;
  }
  .final-grid {
    gap: 8px;
  }
  .final-card {
    padding: 6px;
    border-radius: 13px;
  }
  .final-name {
    font-size: 13px;
  }
}
</style>
</head>
<body>
<div class="container">
  <h1>DMD SUKIGAO 9</h1>
  <p class="subtitle">あなたの好きな9人を決めよう♡</p>
  <!-- START -->
  <section id="startScreen" class="screen active">
    <div class="start-box">
      <div class="start-title">
        DMDの中で<br>
        あなたの好きな9人は？
      </div>
      <p class="start-text">
        まずは4人の中から<br>
        一番好きな人を選んでね♡
      </p>
      <button class="start-button" onclick="startGame()">
        はじめる
      </button>
    </div>
  </section>
  <!-- FOUR CHOICES -->
  <section id="choiceScreen" class="screen">
    <div class="progress" id="choiceProgress"></div>
    <div class="question">
      この4人の中で一番好きなのは？
    </div>
    <div id="choices" class="choices"></div>
    <div id="choiceNotice" class="notice"></div>
  </section>
  <!-- DUEL -->
  <section id="duelScreen" class="screen">
    <div class="duel-title" id="duelTitle">
      FINAL DUEL
    </div>
    <div class="duel-subtitle" id="duelSubtitle">
      より好きな方を選んでね♡
    </div>
    <div id="duelChoices" class="duel"></div>
  </section>
  <!-- RESULT -->
  <section id="resultScreen" class="screen">
    <div class="result-title">
      YOUR SUKIGAO 9 ♡
    </div>
    <div class="result-subtitle">
      あなたが選んだ9人
    </div>
    <div id="finalGrid" class="final-grid"></div>
    <button class="retry-button" onclick="location.reload()">
      もう一度やる

</div>

/* =========================================================
   GAME VARIABLES
========================================================= */
let currentChoices = [];
let winners = [];
let choiceRound = 0;
let choiceTotal = 0;
let duelQueue = [];
let duelWinners = [];
let duelLosers = [];
let duelStage = 0;
let duelIndex = 0;
/* =========================================================
   SCREEN
========================================================= */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}
/* =========================================================
   RANDOMIZE
========================================================= */
function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
/* =========================================================
   IMAGE URL
========================================================= */
function imagePath(file) {
  /*
    日本語ファイル名・スペース・特殊文字も
    URLとして安全に扱う
  */
  return encodeURI(file);
}
/* =========================================================
   START
========================================================= */
function startGame() {
  winners = [];
  choiceRound = 0;
  const shuffled = shuffle(members);
  /*
    47人を4人ずつに分ける。
    47 ÷ 4
    = 11グループ + 3人
    → 12人が予選通過
  */
  currentChoices = [];
  for (let i = 0; i < shuffled.length; i += 4) {
    currentChoices.push(
      shuffled.slice(i, i + 4)
    );
  }
  choiceTotal = currentChoices.length;
  showNextChoice();
}
/* =========================================================
   FOUR CHOICE ROUND
========================================================= */
function showNextChoice() {
  if (choiceRound >= currentChoices.length) {
    startFirstDuel();
    return;
  }
  const group = currentChoices[choiceRound];
  document.getElementById("choiceProgress").textContent =
    `ROUND 1　${choiceRound + 1} / ${choiceTotal}`;
  const choices = document.getElementById("choices");
  choices.innerHTML = "";
  group.forEach((member, index) => {
    const button = document.createElement("button");
    button.className = "choice";
    button.innerHTML = `
      <img
        src="${imagePath(member.file)}"
        alt="${member.name}"
        onerror="imageError(this)"
      >
      <div class="choice-name">
        ${member.name}
      </div>
      <div class="choice-number">
        ${index + 1}
      </div>
    `;
    button.onclick = () => {
      winners.push(member);
      choiceRound++;
      showNextChoice();
    };
    choices.appendChild(button);
  });
  showScreen("choiceScreen");
}
/* =========================================================
   IMAGE ERROR
========================================================= */
function imageError(img) {
  img.style.background = "#f5edf2";
  img.style.objectFit = "contain";
  img.alt = "写真を読み込めませんでした";
}
/* =========================================================
   FIRST DUEL
========================================================= */
function startFirstDuel() {
  /*
    予選で12人になっている
  */
  duelQueue = shuffle(winners);
  duelWinners = [];
  duelLosers = [];
  duelStage = 1;
  duelIndex = 0;
  showDuel();
}
/* =========================================================
   DUEL DISPLAY
========================================================= */
function showDuel() {
  if (duelIndex >= duelQueue.length) {
    finishDuelStage();
    return;
  }
  const a = duelQueue[duelIndex];
  const b = duelQueue[duelIndex + 1];
  document.getElementById("duelTitle").textContent =
    "12人 → 6人";
  document.getElementById("duelSubtitle").textContent =
    "この2人なら、どっちがより好き？♡";
  const area = document.getElementById("duelChoices");
  area.innerHTML = "";
  [a, b].forEach(member => {
    const button = document.createElement("button");
    button.className = "duel-card";
    button.innerHTML = `
      <img
        src="${imagePath(member.file)}"
        alt="${member.name}"
        onerror="imageError(this)"
      >
      <div class="duel-name">
        ${member.name}
      </div>
      <div class="duel-number">
        TAP TO CHOOSE
      </div>
    `;
    button.onclick = () => {
      duelWinners.push(member);
      if (member === a) {
        duelLosers.push(b);
      } else {
        duelLosers.push(a);
      }
      duelIndex += 2;
      showDuel();
    };
    area.appendChild(button);
  });
  showScreen("duelScreen");
}
/* =========================================================
   END OF 12 → 6
========================================================= */
function finishDuelStage() {
  /*
    6人の勝者ができた。
    次に6人を3組で比較して
    「さらに比較」する。
  */
  if (duelStage === 1) {
    duelQueue = shuffle(duelWinners);
    duelWinners = [];
    duelIndex = 0;
    duelStage = 2;
    showSecondDuel();
    return;
  }
  /*
    6 → 3 が完成
  */
  if (duelStage === 2) {
    createFinalNine();
  }
}
/* =========================================================
   SECOND DUEL
========================================================= */
function showSecondDuel() {
  if (duelIndex >= duelQueue.length) {
    finishDuelStage();
    return;
  }
  const a = duelQueue[duelIndex];
  const b = duelQueue[duelIndex + 1];
  document.getElementById("duelTitle").textContent =
    "さらに比較";
  document.getElementById("duelSubtitle").textContent =
    "最後の3人を選んでね♡";
  const area = document.getElementById("duelChoices");
  area.innerHTML = "";
  [a, b].forEach(member => {
    const button = document.createElement("button");
    button.className = "duel-card";
    button.innerHTML = `
      <img
        src="${imagePath(member.file)}"
        alt="${member.name}"
        onerror="imageError(this)"
      >
      <div class="duel-name">
        ${member.name}
      </div>
      <div class="duel-number">
        TAP TO CHOOSE
      </div>
    `;
    button.onclick = () => {
      duelWinners.push(member);
      duelIndex += 2;
      showSecondDuel();
    };
    area.appendChild(button);
  });
  showScreen("duelScreen");
}
/* =========================================================
   FINAL 9
========================================================= */
function createFinalNine() {
  /*
    12 → 6 で勝った6人
    その6人 → 3人
    最終9人は
    ・最初の6人
    ・その中からさらに選ばれた3人
    = 9人
    にする。
  */
  const topSix = duelQueue;
  const topThree = duelWinners;
  const finalNine = [
    ...topSix,
    ...topThree
  ];
  /*
    重複防止
  */
  const unique = [];
  finalNine.forEach(member => {
    if (!unique.some(x => x.name === member.name)) {
      unique.push(member);
    }
  });
  /*
    万一9人未満になった場合の補充。
    予選・対戦で選ばれなかった人から補充する。
  */
  if (unique.length < 9) {
    const used = new Set(
      unique.map(member => member.name)
    );
    const backup = shuffle(
      members.filter(
        member => !used.has(member.name)
      )
    );
    while (unique.length < 9 && backup.length > 0) {
      unique.push(backup.shift());
    }
  }
  showFinal(unique.slice(0, 9));
}
/* =========================================================
   RESULT
========================================================= */
function showFinal(finalNine) {
  const grid = document.getElementById("finalGrid");
  grid.innerHTML = "";
  finalNine.forEach((member, index) => {
    const card = document.createElement("div");
    card.className = "final-card";
    card.innerHTML = `
      <img
        src="${imagePath(member.file)}"
        alt="${member.name}"
        onerror="imageError(this)"
      >
      <div class="final-rank">
        NO.${index + 1}
      </div>
      <div class="final-name">
        ${member.name}
      </div>
    `;
    grid.appendChild(card);
  });
  showScreen("resultScreen");
}
