<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMD SUKIGAO 9</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fff9fc;
  color: #30252d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 30px 18px 50px;
}

.card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 30px;
  padding: 30px 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(170,90,130,.08);
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.small-title {
  color: #a36b88;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 3px;
}

h1 {
  margin: 12px 0 0;
  font-size: 34px;
  line-height: 1.3;
}

.subtitle {
  margin-top: 20px;
  line-height: 1.8;
  font-weight: bold;
}

.heart {
  color: #e98ab5;
}

.start-button,
.next-button,
.retry-button {
  width: 100%;
  margin-top: 28px;
  padding: 17px;
  border: none;
  border-radius: 18px;
  background: #b84f87;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.start-button:active,
.next-button:active,
.retry-button:active {
  transform: scale(.98);
}

.progress {
  color: #a36b88;
  font-size: 14px;
  margin-bottom: 8px;
}

.question {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.members {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.member {
  border: 3px solid transparent;
  background: white;
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .15s;
}

.member.selected {
  border-color: #e98ab5;
  background: #fff0f7;
  transform: scale(.97);
}

.photo {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 15px;
  background: linear-gradient(135deg,#f1e7ed,#e4d5de);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-size: 35px;
  font-weight: bold;
}

.member-name {
  margin-top: 9px;
  font-weight: bold;
  font-size: 17px;
}

.member-gen {
  margin-top: 3px;
  color: #999;
  font-size: 12px;
}

.note {
  color: #aaa0a6;
  font-size: 12px;
  margin-top: 20px;
  line-height: 1.7;
}

/* 最終9人 */

.final-grid {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.final-card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 17px;
  padding: 8px;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.final-photo {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 13px;
  background: linear-gradient(135deg,#f1e7ed,#e4d5de);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-size: 25px;
  font-weight: bold;
}

.final-number {
  color: #a36b88;
  font-size: 12px;
  font-weight: bold;
  margin-top: 6px;
}

.final-name {
  font-weight: bold;
  font-size: 14px;
  margin-top: 3px;
  word-break: break-word;
}

.final-gen {
  color: #999;
  font-size: 10px;
  margin-top: 2px;
}

</style>
</head>

<body>

<main class="container">

<!-- START -->

<section id="startScreen" class="card screen active">

  <div class="small-title">
    DMD SUKIGAO 9
  </div>

  <h1>
    DMD<br>
    好き顔9選メーカー
  </h1>

  <div class="subtitle">
    DMDメンバーから<br>
    「顔が好き」9人を決めよう
    <span class="heart">💗</span>
  </div>

  <div class="note">
    4人の中から好きな2人を選んでね。<br>
    同じメンバーが何度も登場するよ！
  </div>

  <button
    class="start-button"
    onclick="startGame()">
    はじめる 💗
  </button>

</section>


<!-- GAME -->

<section id="gameScreen" class="card screen">

  <div id="progress" class="progress"></div>

  <div id="question" class="question"></div>

  <div id="members" class="members"></div>

  <button
    id="nextButton"
    class="next-button"
    onclick="confirmSelection()"
    style="display:none;">
    決定 💗
  </button>

</section>


<!-- RESULT -->

<section id="resultScreen" class="card screen">

  <div class="small-title">
    DMD SUKIGAO 9
  </div>

  <h1>
    好き顔9 💗
  </h1>

  <div class="subtitle">
    あなたが選び抜いた9人！
  </div>

  <div id="resultGrid" class="final-grid"></div>

  <button
    class="retry-button"
    onclick="startGame()">
    もう一回やる
  </button>

</section>

</main>


<script>

/* =====================================
   DMD MEMBERS
===================================== */

const members = [

  {name:"Max",gen:"Gen 1"},
  {name:"Zee",gen:"Gen 1"},
  {name:"Poppy",gen:"Gen 1"},
  {name:"Park",gen:"Gen 1"},
  {name:"Mark",gen:"Gen 1"},
  {name:"Jimmy",gen:"Gen 1"},
  {name:"Tommy",gen:"Gen 1"},

  {name:"NuNew",gen:"Gen 2"},
  {name:"Net",gen:"Gen 2"},
  {name:"Nat",gen:"Gen 2"},
  {name:"Yim",gen:"Gen 2"},
  {name:"Tutor",gen:"Gen 2"},
  {name:"James",gen:"Gen 2"},

  {name:"Tle",gen:"Gen 3"},
  {name:"Keng",gen:"Gen 3"},
  {name:"FirstOne",gen:"Gen 3"},
  {name:"Latte",gen:"Gen 3"},
  {name:"Thomas",gen:"Gen 3"},
  {name:"Namping",gen:"Gen 3"},
  {name:"Kong",gen:"Gen 3"},
  {name:"Gems",gen:"Gen 3"},
  {name:"TeeTee",gen:"Gen 3"},

  {name:"Kim",gen:"Gen 4"},
  {name:"JJ",gen:"Gen 4"},
  {name:"Ohm",gen:"Gen 4"},
  {name:"Auau",gen:"Gen 4"},
  {name:"Ryujin",gen:"Gen 4"},
  {name:"Patji",gen:"Gen 4"},
  {name:"Por",gen:"Gen 4"},
  {name:"Save",gen:"Gen 4"},

  {name:"Porsche",gen:"Gen 5"},
  {name:"Copper",gen:"Gen 5"},
  {name:"Otto",gen:"Gen 5"},
  {name:"Pung",gen:"Gen 5"},
  {name:"North",gen:"Gen 5"},
  {name:"Phupha",gen:"Gen 5"},
  {name:"Wave",gen:"Gen 5"},
  {name:"Fifa",gen:"Gen 5"},
  {name:"Pete",gen:"Gen 5"},

  {name:"Teddy",gen:"Gen 6"},
  {name:"Nick",gen:"Gen 6"},
  {name:"Nan",gen:"Gen 6"},
  {name:"Ton",gen:"Gen 6"},
  {name:"Reeon",gen:"Gen 6"},
  {name:"Few",gen:"Gen 6"},
  {name:"Thee",gen:"Gen 6"},
  {name:"JT",gen:"Gen 6"}

];


/* =====================================
   GAME SETTINGS
===================================== */

const ROUND1_GAMES = 30;
const ROUND2_GAMES = 20;

let round = 1;
let gameNumber = 0;

let currentCandidates = [];
let selected = [];

let votes = {};


/* =====================================
   SHUFFLE
===================================== */

function shuffle(array) {

  const result = [...array];

  for(let i = result.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] =
    [result[j], result[i]];

  }

  return result;
}


/* =====================================
   START
===================================== */

function startGame() {

  round = 1;
  gameNumber = 0;

  selected = [];

  votes = {};

  members.forEach(member => {

    votes[member.name] = 0;

  });

  document
    .getElementById("startScreen")
    .classList.remove("active");

  document
    .getElementById("resultScreen")
    .classList.remove("active");

  document
    .getElementById("gameScreen")
    .classList.add("active");

  showNextGame();

}


/* =====================================
   RANDOM 4 PEOPLE
===================================== */

function getRandomFour(array) {

  return shuffle(array).slice(0,4);

}


/* =====================================
   SHOW GAME
===================================== */

function showNextGame() {

  selected = [];

  let pool;

  if(round === 1) {

    pool = members;

  } else {

    pool = currentCandidates;

  }

  currentCandidates =
    getRandomFour(pool);


  document
    .getElementById("members")
    .innerHTML = "";

  document
    .getElementById("nextButton")
    .style.display = "none";


  const totalGames =
    round === 1
      ? ROUND1_GAMES
      : ROUND2_GAMES;


  document
    .getElementById("progress")
    .textContent =
      `ROUND ${round}　${gameNumber + 1} / ${totalGames}`;


  document
    .getElementById("question")
    .textContent =
      "この4人から好きな2人を選んでね♡";


  currentCandidates.forEach(
    (member,index) => {

      const element =
        document.createElement("div");

      element.className = "member";

      element.onclick =
        function() {

          toggleMember(
            element,
            index
          );

        };


      element.innerHTML = `

        <div class="photo">
          ${member.name.charAt(0)}
        </div>

        <div class="member-name">
          ${member.name}
        </div>

        <div class="member-gen">
          ${member.gen}
        </div>

      `;


      document
        .getElementById("members")
        .appendChild(element);

    }
  );

}


/* =====================================
   SELECT
===================================== */

function toggleMember(element,index) {

  if(selected.includes(index)) {

    selected =
      selected.filter(
        i => i !== index
      );

    element
      .classList
      .remove("selected");

  } else {

    if(selected.length >= 2) {

      return;

    }

    selected.push(index);

    element
      .classList
      .add("selected");

  }


  document
    .getElementById("nextButton")
    .style.display =
      selected.length === 2
        ? "block"
        : "none";

}


/* =====================================
   CONFIRM
===================================== */

function confirmSelection() {

  selected.forEach(index => {

    const member =
      currentCandidates[index];

    votes[member.name]++;

  });


  gameNumber++;


  const totalGames =
    round === 1
      ? ROUND1_GAMES
      : ROUND2_GAMES;


  /* ROUND終了 */

  if(gameNumber >= totalGames) {

    finishRound();

    return;

  }


  showNextGame();

}


/* =====================================
   FINISH ROUND
===================================== */

function finishRound() {

  /* ROUND 1終了 */

  if(round === 1) {

    currentCandidates =
      getTopMembers(12);

    round = 2;

    gameNumber = 0;

    showNextGame();

    return;

  }


  /* ROUND 2終了 */

  if(round === 2) {

    const finalNine =
      getTopMembers(9);

    showResult(finalNine);

  }

}


/* =====================================
   GET TOP MEMBERS
===================================== */

function getTopMembers(count) {

  return [...members]
    .sort((a,b) => {

      const difference =
        votes[b.name] - votes[a.name];

      /*
        同票の場合はランダム
      */

      if(difference === 0) {

        return Math.random() - 0.5;

      }

      return difference;

    })
    .slice(0,count);

}


/* =====================================
   FINAL RESULT
===================================== */

function showResult(finalNine) {

  document
    .getElementById("gameScreen")
    .classList.remove("active");

  document
    .getElementById("resultScreen")
    .classList.add("active");


  const grid =
    document.getElementById("resultGrid");

  grid.innerHTML = "";


  /*
      4 5 6
      2 1 3
      7 8 9
  */


  const displayOrder = [

    finalNine[3],
    finalNine[4],
    finalNine[5],

    finalNine[1],
    finalNine[0],
    finalNine[2],

    finalNine[6],
    finalNine[7],
    finalNine[8]

  ];


  const numbers = [

    4,5,6,
    2,1,3,
    7,8,9

  ];


  displayOrder.forEach(
    (member,index) => {

      const card =
        document.createElement("div");

      card.className =
        "final-card";


      card.innerHTML = `

        <div class="final-photo">
          ${member.name.charAt(0)}
        </div>

        <div class="final-number">
          ${numbers[index]}
        </div>

        <div class="final-name">
          ${member.name}
        </div>

        <div class="final-gen">
          ${member.gen}
        </div>

      `;


      grid.appendChild(card);

    }
  );

}

</script>

</body>
</html>
