<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMD SUKIGAO 9</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  background: #fff9fc;
  color: #30252d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}
.container {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 30px 18px 50px;
}
.card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 30px;
  padding: 30px 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(170,90,130,.08);
}
.screen {
  display: none;
}
.screen.active {
  display: block;
}
.small-title {
  color: #a36b88;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 3px;
}
h1 {
  margin: 12px 0 0;
  font-size: 34px;
  line-height: 1.3;
}
.subtitle {
  margin-top: 20px;
  line-height: 1.8;
  font-weight: bold;
}
.heart {
  color: #e98ab5;
}
.start-button,
.next-button,
.retry-button {
  width: 100%;
  margin-top: 28px;
  padding: 17px;
  border: none;
  border-radius: 18px;
  background: #b84f87;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
.start-button:active,
.next-button:active,
.retry-button:active {
  transform: scale(.98);
}
.progress {
  color: #a36b88;
  font-size: 14px;
  margin-bottom: 8px;
}
.question {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}
.members {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.member {
  border: 3px solid transparent;
  background: white;
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .15s;
}
.member.selected {
  border-color: #e98ab5;
  background: #fff0f7;
  transform: scale(.97);
}
.photo {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 15px;
  overflow: hidden;
  background: linear-gradient(135deg,#f1e7ed,#e4d5de);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-size: 35px;
  font-weight: bold;
}
.photo img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
}
.member-name {
  margin-top: 9px;
  font-weight: bold;
  font-size: 17px;
}
.member-gen {
  margin-top: 3px;
  color: #999;
  font-size: 12px;
}
.note {
  color: #aaa0a6;
  font-size: 12px;
  margin-top: 20px;
  line-height: 1.7;
}
.final-grid {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.final-card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 17px;
  padding: 8px;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
}
.final-photo {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 13px;
  overflow: hidden;
  background: linear-gradient(135deg,#f1e7ed,#e4d5de);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-size: 25px;
  font-weight: bold;
}
.final-photo img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
}
.final-number {
  color: #a36b88;
  font-size: 12px;
  font-weight: bold;
  margin-top: 6px;
}
.final-name {
  font-weight: bold;
  font-size: 14px;
  margin-top: 3px;
  word-break: break-word;
}
.final-gen {
  color: #999;
  font-size: 10px;
  margin-top: 2px;
}
.rank-list {
  margin-top: 25px;
  text-align: left;
}
.rank-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 5px;
  border-bottom: 1px solid #f0e4eb;
}
.rank-number {
  width: 30px;
  font-weight: bold;
  color: #a36b88;
}
.rank-name {
  flex: 1;
  font-weight: bold;
}
.rank-wins {
  color: #999;
  font-size: 12px;
}
</style>
</head>
<body>
<main class="container">
<section id="startScreen" class="card screen active">
  <div class="small-title">
    DMD SUKIGAO 9
  </div>
  <h1>
    DMD<br>
    好き顔9選メーカー
  </h1>
  <div class="subtitle">
    DMDメンバーから<br>
    「顔が好き」TOP9を決めよう
    <span class="heart">💗</span>
  </div>
  <div class="note">
    直感で選んでね。<br>
    同じ人が何度も登場することもあるよ♡
  </div>
  <button class="start-button" onclick="startGame()">
    はじめる 💗
  </button>
</section>
<section id="gameScreen" class="card screen">
  <div id="progress" class="progress"></div>
  <div id="question" class="question"></div>
  <div id="members" class="members"></div>

<button
id=“nextButton”
class=“next-button”
onclick=“confirmSelection()”
style=“display:none;”

決定 💗
  </button>
</section>
<section id="resultScreen" class="card screen">
  <div class="small-title">
    DMD SUKIGAO 9
  </div>
  <h1>
    好き顔9 💗
  </h1>
  <div class="subtitle">
    あなたのTOP9！
  </div>
  <div id="resultGrid" class="final-grid"></div>
  <div id="rankList" class="rank-list"></div>
  <button class="retry-button" onclick="startGame()">
    もう一回やる
  </button>
</section>
</main>
<script>
const members = [

  {name:"Thee",gen:"Gen 6"},
  {name:"JT",gen:"Gen 6"}
];
const photoFiles = {
  "Yim": "いむ.jpg",
  "Auau": "うう.jpg",
  "Wave": "うぇーぶ.jpg",
  "Otto": "おっとー.jpg",
  "Ohm": "おむ.jpg",

  "Keng": "けん.jpg",

  "Reeonn": "Reeonn .jpg",

  "Copper": "こぱ.jpg",
  "Kong": "こん.jpg",
  "JJ": "じぇじぇ.jpg",
  "Gems": "じぇむず.jpg",
  "JT": "じぇーでぃー.jpg",
  "James": "じぇーむす.jpg",
  "Jimmy": "じみー.jpg",
  "Zee": "しー.jpg",
  "Save": "せぶ.jpg",
  "Tutor": "ちゅた.jpg",
  "TeeTee": "てぃてぃ.jpg",
  "Teddy": "てでぃー.jpg",
  "Tommy": "とみー.jpg",

  "Nat": "なっと.jpg",
  "Nan": "なん.jpg",
  "Namping": "なんぴん.jpg",
  "Nick": "にっく.jpg",
  "NuNew": "ぬぬ.jpg",
  "Net": "ねっと.jpg",
  "North": "のーす.jpg",
  "Patji": "ぱっち.jpg",
  "Pung": "ぱん.jpg",
  "Park": "ぱーく.jpg",
  "Pete": "ぴーと.jpg",
  "FirstOne": "ふぁすわん.jpg",
  "Fifa": "ふぃふぁ.jpg",
  "Phupha": "ぷーぱー.jpg",
  "Poppy": "ぽぴー.jpg",
  "Por": "ぽー.jpg",
  "Porsche": "ぽーしぇ.jpg",
  "Max": "まっくす.jpg",
  "Mark": "まーく.jpg",
  "Latte": "らて.jpg",
  "Ryujin": "IMG_8694.jpeg"
};
const ROUND1_GAMES = 30;
const ROUND2_GAMES = 20;
const ROUND3_GAMES = 15;
const ROUND4_GAMES = 54;
let round = 1;
let gameNumber = 0;
let currentCandidates = [];
let selected = [];
let votes = {};
let round1Selected = {};
let round2Selected = {};
let round3Selected = {};
let round4Wins = {};
let round2Pool = [];
let round3Pool = [];
let final18 = [];
let finalMatchups = [];
function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] =
    [result[j], result[i]];
  }
  return result;
}
function startGame() {
  round = 1;
  gameNumber = 0;
  selected = [];
  round2Pool = [];
  round3Pool = [];
  final18 = [];
  finalMatchups = [];
  votes = {};
  round1Selected = {};
  round2Selected = {};
  round3Selected = {};
  round4Wins = {};
  members.forEach(member => {
    votes[member.name] = 0;
    round1Selected[member.name] = 0;
    round2Selected[member.name] = 0;
    round3Selected[member.name] = 0;
    round4Wins[member.name] = 0;
  });
  document.getElementById("startScreen")
    .classList.remove("active");
  document.getElementById("resultScreen")
    .classList.remove("active");
  document.getElementById("gameScreen")
    .classList.add("active");
  showNextGame();
}
function weightedRandomMember(pool, scoreObject) {
  let total = 0;
  pool.forEach(member => {
    total +=
      (scoreObject[member.name] || 0) + 1;
  });
  let random = Math.random() * total;
  for (const member of pool) {
    random -=
      (scoreObject[member.name] || 0) + 1;
    if (random <= 0) {
      return member;
    }
  }
  return pool[
    Math.floor(
      Math.random() * pool.length
    )
  ];
}
function getFourPeople(pool, scoreObject) {
  let result = [];
  let safety = 0;
  while (
    result.length < 4 &&
    safety < 1000
  ) {
    safety++;
    const person =
      weightedRandomMember(
        pool,
        scoreObject
      );
    if (
      person &&
      !result.some(
        x => x.name === person.name
      )
    ) {
      result.push(person);
    }
  }
  return result;
}
function getRound1Group() {
  return getFourPeople(
    members,
    round1Selected
  );
}
function createRound2Pool() {
  let pool = [];
  members.forEach(member => {
    pool.push(member);
  });
  members.forEach(member => {
    const count =
      round1Selected[member.name];
    for (
      let i = 0;
      i < Math.min(count,4);
      i++
    ) {
      pool.push(member);
    }
  });
  return pool;
}
function getRound2Group() {
  if (round2Pool.length === 0) {
    round2Pool =
      createRound2Pool();
  }
  return getFourPeople(
    round2Pool,
    round1Selected
  );
}
function createRound3Pool() {
  return [...members]
    .sort((a,b) => {
      const scoreA =
        round1Selected[a.name] +
        round2Selected[a.name];
      const scoreB =
        round1Selected[b.name] +
        round2Selected[b.name];
      if (scoreA === scoreB) {
        return Math.random() - 0.5;
      }
      return scoreB - scoreA;
    })
    .slice(0,24);
}
function getRound3Group() {
  if (round3Pool.length === 0) {
    round3Pool =
      createRound3Pool();
  }
  let score = {};
  round3Pool.forEach(member => {
    score[member.name] =
      round1Selected[member.name] +
      round2Selected[member.name];
  });
  return getFourPeople(
    round3Pool,
    score
  );
}
function createFinal18() {
  return [...members]
    .sort((a,b) => {
      const scoreA =
        round1Selected[a.name] +
        round2Selected[a.name] +
        round3Selected[a.name];
      const scoreB =
        round1Selected[b.name] +
        round2Selected[b.name] +
        round3Selected[b.name];
      if (scoreA === scoreB) {
        return Math.random() - 0.5;
      }
      return scoreB - scoreA;
    })
    .slice(0,18);
}
function createRound4Matches() {
  let slots = [];
  final18.forEach(member => {
    for (let i = 0; i < 6; i++) {
      slots.push(member);
    }
  });
  for (
    let attempt = 0;
    attempt < 1000;
    attempt++
  ) {
    slots = shuffle(slots);
    let valid = true;
    for (
      let i = 0;
      i < slots.length;
      i += 2
    ) {
      if (
        slots[i].name ===
        slots[i + 1].name
      ) {
        valid = false;
        break;
      }
    }
    if (valid) break;
  }
  let matches = [];
  for (
    let i = 0;
    i < slots.length;
    i += 2
  ) {
    matches.push([
      slots[i],
      slots[i + 1]
    ]);
  }
  return matches;
}
function showNextGame() {
  selected = [];
  if (round === 1) {
    currentCandidates =
      getRound1Group();
  }
  else if (round === 2) {
    currentCandidates =
      getRound2Group();
  }
  else if (round === 3) {
    currentCandidates =
      getRound3Group();
  }
  else {
    currentCandidates =
      finalMatchups[gameNumber];
  }
  document.getElementById("members")
    .innerHTML = "";
  document.getElementById("nextButton")
    .style.display = "none";
  if (round === 4) {
    document.getElementById("progress")
      .textContent =
      `FINAL　${gameNumber + 1} / ${ROUND4_GAMES}`;
    document.getElementById("question")
      .textContent =
      "この2人なら、顔が好きなのはどっち？♡";
  }
  else {
    const total =
      round === 1
        ? ROUND1_GAMES
        : round === 2
          ? ROUND2_GAMES
          : ROUND3_GAMES;
    document.getElementById("progress")
      .textContent =
      `ROUND ${round}　${gameNumber + 1} / ${total}`;
    document.getElementById("question")
      .textContent =
      "この4人から好きな2人を選んでね♡";
  }
  currentCandidates.forEach(
    (member,index) => {
      const element =
        document.createElement("div");
      element.className = "member";
      element.onclick =
        function() {
          toggleMember(
            element,
            index
          );
        };
      const photo =
        photoFiles[member.name];
      element.innerHTML = `
        <div class="photo">
          ${
            photo
              ? `<img src="${photo}" alt="${member.name}">`
              : member.name.charAt(0)
          }
        </div>
        <div class="member-name">
          ${member.name}
        </div>
        <div class="member-gen">
          ${member.gen}
        </div>
      `;
      document.getElementById("members")
        .appendChild(element);
    }
  );
}
function toggleMember(
  element,
  index
) {
  const limit =
    round === 4
      ? 1
      : 2;
  if (selected.includes(index)) {
    selected =
      selected.filter(
        i => i !== index
      );
    element.classList.remove("selected");
  }
  else {
    if (selected.length >= limit) {
      return;
    }
    selected.push(index);
    element.classList.add("selected");
  }
  document.getElementById("nextButton")
    .style.display =
      selected.length === limit
        ? "block"
        : "none";
}
function confirmSelection() {
  if (round === 1) {
    selected.forEach(index => {
      const member =
        currentCandidates[index];
      round1Selected[member.name]++;
      votes[member.name]++;
    });
    gameNumber++;
    if (gameNumber >= ROUND1_GAMES) {
      round2Pool =
        createRound2Pool();
      round = 2;
      gameNumber = 0;
    }
    showNextGame();
    return;
  }
  if (round === 2) {
    selected.forEach(index => {
      const member =
        currentCandidates[index];
      round2Selected[member.name]++;
      votes[member.name]++;
    });
    gameNumber++;
    if (gameNumber >= ROUND2_GAMES) {
      round3Pool =
        createRound3Pool();
      round = 3;
      gameNumber = 0;
    }
    showNextGame();
    return;
  }
  if (round === 3) {
    selected.forEach(index => {
      const member =
        currentCandidates[index];
      round3Selected[member.name]++;
      votes[member.name]++;
    });
    gameNumber++;
    if (gameNumber >= ROUND3_GAMES) {
      final18 =
        createFinal18();
      finalMatchups =
        createRound4Matches();
      round = 4;
      gameNumber = 0;
    }
    showNextGame();
    return;
  }
  if (round === 4) {
    const winner =
      currentCandidates[
        selected[0]
      ];
    round4Wins[winner.name]++;
    gameNumber++;
    if (gameNumber >= ROUND4_GAMES) {
      showFinalResult();
      return;
    }
    showNextGame();
  }
}
function showFinalResult() {
  const ranking =
    [...final18]
      .sort((a,b) => {
        const winsA =
          round4Wins[a.name];
        const winsB =
          round4Wins[b.name];
        if (winsA === winsB) {
          const totalA =
            round1Selected[a.name] +
            round2Selected[a.name] +
            round3Selected[a.name];
          const totalB =
            round1Selected[b.name] +
            round2Selected[b.name] +
            round3Selected[b.name];
          if (totalA === totalB) {
            return Math.random() - 0.5;
          }
          return totalB - totalA;
        }
        return winsB - winsA;
      });
  const top9 =
    ranking.slice(0,9);
  document.getElementById("gameScreen")
    .classList.remove("active");
  document.getElementById("resultScreen")
    .classList.add("active");
  const displayOrder = [
    top9[3],
    top9[4],
    top9[5],
    top9[1],
    top9[0],
    top9[2],
    top9[6],
    top9[7],
    top9[8]
  ];
  const numbers = [
    4,5,6,
    2,1,3,
    7,8,9
  ];
  const grid =
    document.getElementById("resultGrid");
  grid.innerHTML = "";
  displayOrder.forEach(
    (member,index) => {
      const card =
        document.createElement("div");
      card.className = "final-card";
      const photo =
        photoFiles[member.name];
      card.innerHTML = `
        <div class="final-photo">
          ${
            photo
              ? `<img src="${photo}" alt="${member.name}">`
              : member.name.charAt(0)
          }
        </div>
        <div class="final-number">
          ${numbers[index]}
        </div>
        <div class="final-name">
          ${member.name}
        </div>
        <div class="final-gen">
          ${member.gen}
        </div>
      `;
      grid.appendChild(card);
    }
  );
  const rankList =
    document.getElementById("rankList");
  rankList.innerHTML = "";
  ranking.forEach(
    (member,index) => {
      const row =
        document.createElement("div");
      row.className = "rank-row";
      row.innerHTML = `
        <div class="rank-number">
          ${index + 1}位
        </div>
        <div class="rank-name">
          ${member.name}
        </div>
        <div class="rank-wins">
          ${round4Wins[member.name]}勝
        </div>
      `;
      rankList.appendChild(row);
    }
  );
}
</script>
