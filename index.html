<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMD SUKIGAO 9</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fff9fc;
  color: #30252d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 30px 18px 50px;
}

.card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 30px;
  padding: 30px 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(170,90,130,.08);
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.small-title {
  color: #a36b88;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 3px;
}

h1 {
  margin: 12px 0 0;
  font-size: 34px;
  line-height: 1.3;
}

.subtitle {
  margin-top: 20px;
  line-height: 1.8;
  font-weight: bold;
}

.heart {
  color: #e98ab5;
}

.start-button,
.next-button,
.retry-button {
  width: 100%;
  margin-top: 28px;
  padding: 17px;
  border: none;
  border-radius: 18px;
  background: #b84f87;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.start-button:active,
.next-button:active,
.retry-button:active {
  transform: scale(.98);
}

.progress {
  color: #a36b88;
  font-size: 14px;
  margin-bottom: 8px;
}

.question {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.members {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.member {
  border: 3px solid transparent;
  background: white;
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .15s;
}

.member.selected {
  border-color: #e98ab5;
  background: #fff0f7;
  transform: scale(.97);
}

.photo,
.final-photo {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 15px;
  background: linear-gradient(135deg,#f1e7ed,#e4d5de);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-size: 35px;
  font-weight: bold;
}

.member-name {
  margin-top: 9px;
  font-weight: bold;
  font-size: 17px;
}

.member-gen {
  margin-top: 3px;
  color: #999;
  font-size: 12px;
}

.note {
  color: #aaa0a6;
  font-size: 12px;
  margin-top: 20px;
  line-height: 1.7;
}

.final-grid {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.final-card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 17px;
  padding: 8px;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.final-photo {
  font-size: 25px;
}

.final-number {
  color: #a36b88;
  font-size: 12px;
  font-weight: bold;
  margin-top: 6px;
}

.final-name {
  font-weight: bold;
  font-size: 14px;
  margin-top: 3px;
  word-break: break-word;
}

.final-gen {
  color: #999;
  font-size: 10px;
  margin-top: 2px;
}
</style>
</head>

<body>

<main class="container">

<section id="startScreen" class="card screen active">

  <div class="small-title">
    DMD SUKIGAO 9
  </div>

  <h1>
    DMD<br>
    好き顔9選メーカー
  </h1>

  <div class="subtitle">
    DMDメンバーから<br>
    「顔が好き」9人を決めよう
    <span class="heart">💗</span>
  </div>

  <div class="note">
    4人の中から好きな2人を選んでね。<br>
    選んだ人ほど、また登場するかも…？💗
  </div>

  <button class="start-button" onclick="startGame()">
    はじめる 💗
  </button>

</section>


<section id="gameScreen" class="card screen">

  <div id="progress" class="progress"></div>

  <div id="question" class="question"></div>

  <div id="members" class="members"></div>

  <button
    id="nextButton"
    class="next-button"
    onclick="confirmSelection()"
    style="display:none;">
    決定 💗
  </button>

</section>


<section id="resultScreen" class="card screen">

  <div class="small-title">
    DMD SUKIGAO 9
  </div>

  <h1>
    好き顔9 💗
  </h1>

  <div class="subtitle">
    あなたが選び抜いた9人！
  </div>

  <div id="resultGrid" class="final-grid"></div>

  <button
    class="retry-button"
    onclick="startGame()">
    もう一回やる
  </button>

</section>

</main>


<script>

/* =====================================
   DMD MEMBERS
===================================== */

const members = [

  {name:"Max",gen:"Gen 1"},
  {name:"Zee",gen:"Gen 1"},
  {name:"Poppy",gen:"Gen 1"},
  {name:"Park",gen:"Gen 1"},
  {name:"Mark",gen:"Gen 1"},
  {name:"Jimmy",gen:"Gen 1"},
  {name:"Tommy",gen:"Gen 1"},

  {name:"NuNew",gen:"Gen 2"},
  {name:"Net",gen:"Gen 2"},
  {name:"Nat",gen:"Gen 2"},
  {name:"Yim",gen:"Gen 2"},
  {name:"Tutor",gen:"Gen 2"},
  {name:"James",gen:"Gen 2"},

  {name:"Tle",gen:"Gen 3"},
  {name:"Keng",gen:"Gen 3"},
  {name:"FirstOne",gen:"Gen 3"},
  {name:"Latte",gen:"Gen 3"},
  {name:"Thomas",gen:"Gen 3"},
  {name:"Namping",gen:"Gen 3"},
  {name:"Kong",gen:"Gen 3"},
  {name:"Gems",gen:"Gen 3"},
  {name:"TeeTee",gen:"Gen 3"},

  {name:"Kim",gen:"Gen 4"},
  {name:"JJ",gen:"Gen 4"},
  {name:"Ohm",gen:"Gen 4"},
  {name:"Auau",gen:"Gen 4"},
  {name:"Ryujin",gen:"Gen 4"},
  {name:"Patji",gen:"Gen 4"},
  {name:"Por",gen:"Gen 4"},
  {name:"Save",gen:"Gen 4"},

  {name:"Porsche",gen:"Gen 5"},
  {name:"Copper",gen:"Gen 5"},
  {name:"Otto",gen:"Gen 5"},
  {name:"Pung",gen:"Gen 5"},
  {name:"North",gen:"Gen 5"},
  {name:"Phupha",gen:"Gen 5"},
  {name:"Wave",gen:"Gen 5"},
  {name:"Fifa",gen:"Gen 5"},
  {name:"Pete",gen:"Gen 5"},

  {name:"Teddy",gen:"Gen 6"},
  {name:"Nick",gen:"Gen 6"},
  {name:"Nan",gen:"Gen 6"},
  {name:"Ton",gen:"Gen 6"},
  {name:"Reeon",gen:"Gen 6"},
  {name:"Few",gen:"Gen 6"},
  {name:"Thee",gen:"Gen 6"},
  {name:"JT",gen:"Gen 6"}

];


/* =====================================
   SETTINGS
===================================== */

const ROUND1_GAMES = 30;
const ROUND2_GAMES = 20;


/* =====================================
   GAME VARIABLES
===================================== */

let round = 1;
let gameNumber = 0;

let currentCandidates = [];
let selected = [];

let votes = {};

let round1Appearance = {};
let round1Selected = {};

let round1Queue = [];
let round2Queue = [];

let finalists = [];
let finalIndex = 0;


/* =====================================
   SHUFFLE
===================================== */

function shuffle(array) {

  const result = [...array];

  for(let i = result.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] =
    [result[j], result[i]];

  }

  return result;
}


/* =====================================
   START
===================================== */

function startGame() {

  round = 1;
  gameNumber = 0;

  currentCandidates = [];
  selected = [];

  round1Queue = [];
  round2Queue = [];

  finalists = [];
  finalIndex = 0;

  votes = {};
  round1Appearance = {};
  round1Selected = {};

  members.forEach(member => {

    votes[member.name] = 0;

    round1Appearance[member.name] = 0;

    round1Selected[member.name] = 0;

  });


  document
    .getElementById("startScreen")
    .classList.remove("active");

  document
    .getElementById("resultScreen")
    .classList.remove("active");

  document
    .getElementById("gameScreen")
    .classList.add("active");


  createRound1Schedule();

  showNextGame();

}


/* =====================================
   ROUND 1 SCHEDULE
===================================== */

function createRound1Schedule() {

  /*
    47人 × 2回 = 94登場枠

    30ゲーム × 4人 = 120登場枠

    まず全員2回ずつ確保。
    残り26枠は、
    選ばれた人を優先して追加する。
  */

  let queue = [];


  members.forEach(member => {

    queue.push(member);
    queue.push(member);

  });


  /*
    最低2回分をシャッフル
  */

  queue = shuffle(queue);


  /*
    選ばれた人を追加する枠は、
    実際にROUND1で選ばれた後に
    動的に追加する。
  */

  round1Queue = queue;

}


/* =====================================
   GET ROUND 1 GROUP
===================================== */

function getRound1Group() {

  /*
    まず、まだ2回出ていない人を優先。
  */

  let needsAppearance =
    members.filter(member =>
      round1Appearance[member.name] < 2
    );


  /*
    残り枠がある場合、
    すでに選ばれている人を追加候補にする。
  */

  let pool = [...needsAppearance];


  /*
    追加登場できる人を入れる。
    選択数が多い人ほど候補になりやすい。
  */

  const selectedPeople =
    members.filter(member =>
      round1Selected[member.name] > 0
    );


  selectedPeople.forEach(member => {

    /*
      選ばれた回数に応じて
      最大3回程度まで追加候補にする。
    */

    const extra =
      Math.min(
        round1Selected[member.name],
        2
      );

    for(let i = 0; i < extra; i++) {

      pool.push(member);

    }

  });


  /*
    重複人物を除く
  */

  const uniquePool =
    [...new Map(
      pool.map(member =>
        [member.name, member]
      )
    ).values()];


  return shuffle(uniquePool).slice(0,4);

}


/* =====================================
   SHOW NEXT GAME
===================================== */

function showNextGame() {

  selected = [];


  if(round === 1) {

    currentCandidates =
      getRound1Group();

  }

  else if(round === 2) {

    currentCandidates =
      getRound2Group();

  }

  else {

    currentCandidates =
      finalists.slice(
        finalIndex * 2,
        finalIndex * 2 + 2
      );

  }


  document
    .getElementById("members")
    .innerHTML = "";

  document
    .getElementById("nextButton")
    .style.display = "none";


  let totalGames;

  if(round === 1) {

    totalGames = ROUND1_GAMES;

  }

  else if(round === 2) {

    totalGames = ROUND2_GAMES;

  }

  else {

    totalGames = 9;

  }


  if(round === 3) {

    document
      .getElementById("progress")
      .textContent =
      `FINAL　${finalIndex + 1} / 9`;

    document
      .getElementById("question")
      .textContent =
      "この2人から、顔が好きな1人を選んでね♡";

  }

  else {

    document
      .getElementById("progress")
      .textContent =
      `ROUND ${round}　${gameNumber + 1} / ${totalGames}`;

    document
      .getElementById("question")
      .textContent =
      "この4人から好きな2人を選んでね♡";

  }


  currentCandidates.forEach(
    (member,index) => {

      const element =
        document.createElement("div");

      element.className = "member";

      element.onclick =
        function() {

          toggleMember(
            element,
            index
          );

        };


      element.innerHTML = `

        <div class="photo">
          ${member.name.charAt(0)}
        </div>

        <div class="member-name">
          ${member.name}
        </div>

        <div class="member-gen">
          ${member.gen}
        </div>

      `;


      document
        .getElementById("members")
        .appendChild(element);

    }
  );

}


/* =====================================
   ROUND 2 SCHEDULE
===================================== */

function createRound2Schedule() {

  let selectedPeople =
    members.filter(member =>
      round1Selected[member.name] > 0
    );


  let neverSelected =
    members.filter(member =>
      round1Selected[member.name] === 0
    );


  /*
    ROUND 1で選ばれた人を基本候補にする。
    ただし、選ばれていない人も
    全員最低1回は登場させる。
  */

  let queue = [];


  /*
    まず全員1回
  */

  members.forEach(member => {

    queue.push(member);

  });


  /*
    残りの枠は選ばれた人を追加。
    選ばれた回数が多いほど多く追加する。
  */

  selectedPeople.forEach(member => {

    const extra =
      Math.min(
        3,
        round1Selected[member.name]
      );

    for(let i = 0; i < extra; i++) {

      queue.push(member);

    }

  });


  /*
    80枠に収める
  */

  round2Queue =
    shuffle(queue);


  while(round2Queue.length < ROUND2_GAMES * 4) {

    if(selectedPeople.length > 0) {

      const weighted =
        shuffle(selectedPeople);

      weighted.forEach(member => {

        if(round2Queue.length <
          ROUND2_GAMES * 4) {

          round2Queue.push(member);

        }

      });

    } else {

      break;

    }

  }


  round2Queue =
    round2Queue.slice(
      0,
      ROUND2_GAMES * 4
    );

}


/* =====================================
   GET ROUND 2 GROUP
===================================== */

function getRound2Group() {

  /*
    キューから4人ずつ取り出す。

    同じ人が同じ4人の中に
    2回入らないようにする。
  */

  let group = [];


  while(group.length < 4) {

    if(round2Queue.length === 0) {

      /*
        万一キューがなくなったら
        選ばれた人から補充。
      */

      const selectedPeople =
        members.filter(member =>
          round1Selected[member.name] > 0
        );


      round2Queue =
        shuffle(selectedPeople);

    }


    const next =
      round2Queue.shift();


    if(
      next &&
      !group.some(
        member =>
          member.name === next.name
      )
    ) {

      group.push(next);

    }

  }


  return group;

}


/* =====================================
   SELECT
===================================== */

function toggleMember(element,index) {

  if(selected.includes(index)) {

    selected =
      selected.filter(
        i => i !== index
      );

    element
      .classList
      .remove("selected");

  }

  else {

    const limit =
      round === 3 ? 1 : 2;


    if(selected.length >= limit) {

      return;

    }


    selected.push(index);

    element
      .classList
      .add("selected");

  }


  const required =
    round === 3 ? 1 : 2;


  document
    .getElementById("nextButton")
    .style.display =
      selected.length === required
        ? "block"
        : "none";

}


/* =====================================
   CONFIRM
===================================== */

function confirmSelection() {

  /*
    ROUND 1
  */

  if(round === 1) {

    selected.forEach(index => {

      const member =
        currentCandidates[index];

      votes[member.name]++;

      round1Selected[member.name]++;

    });


    currentCandidates.forEach(member => {

      round1Appearance[member.name]++;

    });


    gameNumber++;


    if(gameNumber >= ROUND1_GAMES) {

      finishRound1();

      return;

    }


    showNextGame();

    return;

  }


  /*
    ROUND 2
  */

  if(round === 2) {

    selected.forEach(index => {

      const member =
        currentCandidates[index];

      votes[member.name]++;

    });


    gameNumber++;


    if(gameNumber >= ROUND2_GAMES) {

      finishRound2();

      return;

    }


    showNextGame();

    return;

  }


  /*
    FINAL
  */

  if(round === 3) {

    const winner =
      currentCandidates[selected[0]];


    finalists[
      9 + finalIndex
    ] = winner;


    finalIndex++;


    if(finalIndex >= 9) {

      showFinalResult();

      return;

    }


    showNextGame();

  }

}


/* =====================================
   FINISH ROUND 1
===================================== */

function finishRound1() {

  /*
    ROUND 1終了。

    ここでROUND 2の
    登場スケジュールを作る。
  */

  createRound2Schedule();

  round = 2;

  gameNumber = 0;

  showNextGame();

}


/* =====================================
   FINISH ROUND 2
===================================== */

function finishRound2() {

  /*
    ROUND 2までの票を合計して
    上位18人をFINALへ。
  */

  const top18 =
    [...members]
      .sort((a,b) => {

        const difference =
          votes[b.name] -
          votes[a.name];

        if(difference === 0) {

          return Math.random() - 0.5;

        }

        return difference;

      })
      .slice(0,18);


  finalists = top18;

  finalIndex = 0;

  round = 3;

  gameNumber = 0;

  showNextGame();

}


/* =====================================
   FINAL RESULT
===================================== */

function showFinalResult() {

  /*
    finalistsの最初の9個を
    最終9人として表示。

    FINALで勝った人は
    finalists[9]〜に入っているので、
    そこから取り出す。
  */

  const winners =
    finalists
      .slice(9,18)
      .filter(Boolean);


  document
    .getElementById("gameScreen")
    .classList.remove("active");

  document
    .getElementById("resultScreen")
    .classList.add("active");


  const grid =
    document.getElementById("resultGrid");

  grid.innerHTML = "";


  /*
      4 5 6
      2 1 3
      7 8 9
  */

  const displayOrder = [

    winners[3],
    winners[4],
    winners[5],

    winners[1],
    winners[0],
    winners[2],

    winners[6],
    winners[7],
    winners[8]

  ];


  const numbers = [

    4,5,6,
    2,1,3,
    7,8,9

  ];


  displayOrder.forEach(
    (member,index) => {

      const card =
        document.createElement("div");

      card.className =
        "final-card";


      card.innerHTML = `

        <div class="final-photo">
          ${member.name.charAt(0)}
        </div>

        <div class="final-number">
          ${numbers[index]}
        </div>

        <div class="final-name">
          ${member.name}
        </div>

        <div class="final-gen">
          ${member.gen}
        </div>

      `;


      grid.appendChild(card);

    }
  );

}

</script>

</body>
</html>
