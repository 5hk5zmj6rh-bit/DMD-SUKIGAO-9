<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMD SUKIGAO 9</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fff9fc;
  color: #30252d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 30px 18px 50px;
}

.card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 30px;
  padding: 30px 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(170,90,130,.08);
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.small-title {
  color: #a36b88;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 3px;
}

h1 {
  margin: 12px 0 0;
  font-size: 34px;
}

.subtitle {
  margin-top: 20px;
  line-height: 1.8;
  font-weight: bold;
}

.heart {
  color: #e98ab5;
}

.start-button,
.next-button,
.retry-button {
  width: 100%;
  margin-top: 28px;
  padding: 17px;
  border: none;
  border-radius: 18px;
  background: #b84f87;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.start-button:active,
.next-button:active,
.retry-button:active {
  transform: scale(.98);
}

.progress {
  color: #a36b88;
  font-size: 14px;
  margin-bottom: 8px;
}

.question {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.members {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.member {
  border: 3px solid transparent;
  background: white;
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .15s;
}

.member.selected {
  border-color: #e98ab5;
  background: #fff0f7;
  transform: scale(.97);
}

.photo {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 15px;
  background: linear-gradient(135deg,#f1e7ed,#e4d5de);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-size: 35px;
  font-weight: bold;
}

.member-name {
  margin-top: 9px;
  font-weight: bold;
  font-size: 17px;
}

.member-gen {
  margin-top: 3px;
  color: #999;
  font-size: 12px;
}

.result-title {
  font-size: 28px;
  font-weight: bold;
}

.result-list {
  margin-top: 20px;
  display: grid;
  gap: 10px;
}

.result-item {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 17px;
  padding: 14px;
  display: flex;
  align-items: center;
  text-align: left;
}

.result-number {
  width: 40px;
  font-size: 20px;
  font-weight: bold;
  color: #a36b88;
}

.result-photo {
  width: 52px;
  height: 52px;
  border-radius: 13px;
  background: #eee3e9;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-weight: bold;
  margin-right: 12px;
}

.result-name {
  font-weight: bold;
}

.result-gen {
  color: #999;
  font-size: 12px;
  margin-top: 3px;
}

.note {
  color: #aaa0a6;
  font-size: 12px;
  margin-top: 20px;
  line-height: 1.7;
}
</style>
</head>

<body>

<main class="container">

<!-- START -->
<section id="startScreen" class="card screen active">

  <div class="small-title">
    DMD SUKIGAO 9
  </div>

  <h1>
    DMD<br>
    好き顔9選メーカー
  </h1>

  <div class="subtitle">
    DMDメンバーから<br>
    「顔が好き」9人を決めよう
    <span class="heart">💗</span>
  </div>

  <div class="note">
    推しではなく、顔だけで直感勝負！<br>
    4人の中から好きな人を選んでね。
  </div>

  <button class="start-button" onclick="startGame()">
    はじめる 💗
  </button>

</section>


<!-- GAME -->
<section id="gameScreen" class="card screen">

  <div id="progress" class="progress"></div>

  <div id="question" class="question">
    この4人から好きな2人を選んでね♡
  </div>

  <div id="members" class="members"></div>

  <button
    id="nextButton"
    class="next-button"
    onclick="confirmSelection()"
    style="display:none;">
    決定 💗
  </button>

</section>


<!-- RESULT -->
<section id="resultScreen" class="card screen">

  <div class="result-title">
    DMD好き顔9 💗
  </div>

  <div class="subtitle">
    あなたが選び抜いた9人！
  </div>

  <div id="resultList" class="result-list"></div>

  <button class="retry-button" onclick="startGame()">
    もう一回やる
  </button>

</section>

</main>


<script>

/* =====================================
   DMD MEMBERS
   全47人
===================================== */

const members = [

  /* GEN 1 */
  { name: "Max", gen: "Gen 1" },
  { name: "Zee", gen: "Gen 1" },
  { name: "Poppy", gen: "Gen 1" },
  { name: "Park", gen: "Gen 1" },
  { name: "Mark", gen: "Gen 1" },
  { name: "Jimmy", gen: "Gen 1" },
  { name: "Tommy", gen: "Gen 1" },

  /* GEN 2 */
  { name: "NuNew", gen: "Gen 2" },
  { name: "Net", gen: "Gen 2" },
  { name: "Nat", gen: "Gen 2" },
  { name: "Yim", gen: "Gen 2" },
  { name: "Tutor", gen: "Gen 2" },
  { name: "James", gen: "Gen 2" },

  /* GEN 3 */
  { name: "Tle", gen: "Gen 3" },
  { name: "Keng", gen: "Gen 3" },
  { name: "FirstOne", gen: "Gen 3" },
  { name: "Latte", gen: "Gen 3" },
  { name: "Thomas", gen: "Gen 3" },
  { name: "Namping", gen: "Gen 3" },
  { name: "Kong", gen: "Gen 3" },
  { name: "Gems", gen: "Gen 3" },
  { name: "TeeTee", gen: "Gen 3" },

  /* GEN 4 */
  { name: "Kim", gen: "Gen 4" },
  { name: "JJ", gen: "Gen 4" },
  { name: "Ohm", gen: "Gen 4" },
  { name: "Auau", gen: "Gen 4" },
  { name: "Ryujin", gen: "Gen 4" },
  { name: "Patji", gen: "Gen 4" },
  { name: "Por", gen: "Gen 4" },
  { name: "Save", gen: "Gen 4" },

  /* GEN 5 */
  { name: "Porsche", gen: "Gen 5" },
  { name: "Copper", gen: "Gen 5" },
  { name: "Otto", gen: "Gen 5" },
  { name: "Pung", gen: "Gen 5" },
  { name: "North", gen: "Gen 5" },
  { name: "Phupha", gen: "Gen 5" },
  { name: "Wave", gen: "Gen 5" },
  { name: "Fifa", gen: "Gen 5" },
  { name: "Pete", gen: "Gen 5" },

  /* GEN 6 */
  { name: "Teddy", gen: "Gen 6" },
  { name: "Nick", gen: "Gen 6" },
  { name: "Nan", gen: "Gen 6" },
  { name: "Ton", gen: "Gen 6" },
  { name: "Reeon", gen: "Gen 6" },
  { name: "Few", gen: "Gen 6" },
  { name: "Thee", gen: "Gen 6" },
  { name: "JT", gen: "Gen 6" }

];


/* =====================================
   GAME DATA
===================================== */

let currentPool = [];
let nextPool = [];

let groups = [];
let groupIndex = 0;

let selected = [];

let round = 1;


/* =====================================
   SHUFFLE
===================================== */

function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;
}


/* =====================================
   START
===================================== */

function startGame() {

  currentPool =
    shuffle(members);

  nextPool = [];

  groups = [];

  groupIndex = 0;

  selected = [];

  round = 1;

  document
    .getElementById("startScreen")
    .classList.remove("active");

  document
    .getElementById("resultScreen")
    .classList.remove("active");

  document
    .getElementById("gameScreen")
    .classList.add("active");

  createGroups();

}


/* =====================================
   CREATE GROUPS
===================================== */

function createGroups() {

  groups = [];

  const shuffled =
    shuffle(currentPool);


  /*
    ROUND 1
    47人

    4人 × 11組 = 44人
    残り3人 = 1組

    各組から2人
    → 22 + 2 = 24人
  */

  if (round === 1) {

    for (
      let i = 0;
      i < 44;
      i += 4
    ) {

      groups.push(
        shuffled.slice(i, i + 4)
      );

    }

    groups.push(
      shuffled.slice(44, 47)
    );

  }


  /*
    ROUND 2
    24人

    4人 × 6組

    各組から2人
    → 12人
  */

  else if (round === 2) {

    for (
      let i = 0;
      i < 24;
      i += 4
    ) {

      groups.push(
        shuffled.slice(i, i + 4)
      );

    }

  }


  /*
    FINAL
    12人

    4人 × 3組

    各組から3人
    → 9人
  */

  else if (round === 3) {

    for (
      let i = 0;
      i < 12;
      i += 4
    ) {

      groups.push(
        shuffled.slice(i, i + 4)
      );

    }

  }


  groupIndex = 0;

  showGroup();

}


/* =====================================
   SHOW GROUP
===================================== */

function showGroup() {

  selected = [];

  const group =
    groups[groupIndex];


  document
    .getElementById("members")
    .innerHTML = "";

  document
    .getElementById("nextButton")
    .style.display = "none";


  let required;


  if (round === 3) {

    required = 3;

  } else {

    required = 2;

  }


  document
    .getElementById("progress")
    .textContent =
      `ROUND ${round}　${groupIndex + 1} / ${groups.length}`;


  document
    .getElementById("question")
    .textContent =
      `この${group.length}人から好きな${required}人を選んでね♡`;


  group.forEach(
    (member, index) => {

      const element =
        document.createElement("div");

      element.className = "member";

      element.onclick =
        function() {

          toggleMember(
            element,
            index
          );

        };


      element.innerHTML = `

        <div class="photo">
          ${member.name.charAt(0)}
        </div>

        <div class="member-name">
          ${member.name}
        </div>

        <div class="member-gen">
          ${member.gen}
        </div>

      `;


      document
        .getElementById("members")
        .appendChild(element);

    }
  );

}


/* =====================================
   TOGGLE SELECT
===================================== */

function toggleMember(
  element,
  index
) {

  const required =
    round === 3
      ? 3
      : 2;


  if (
    selected.includes(index)
  ) {

    selected =
      selected.filter(
        i => i !== index
      );

    element
      .classList
      .remove("selected");

  }

  else {

    if (
      selected.length >= required
    ) {

      return;

    }

    selected.push(index);

    element
      .classList
      .add("selected");

  }


  document
    .getElementById("nextButton")
    .style.display =
      selected.length === required
        ? "block"
        : "none";

}


/* =====================================
   CONFIRM
===================================== */

function confirmSelection() {

  const group =
    groups[groupIndex];


  selected.forEach(
    index => {

      nextPool.push(
        group[index]
      );

    }
  );


  groupIndex++;


  if (
    groupIndex < groups.length
  ) {

    showGroup();

    return;

  }


  /*
    ラウンド終了
  */

  currentPool =
    nextPool;

  nextPool = [];


  /*
    ROUND1
    47 → 24
  */

  if (round === 1) {

    round = 2;

    createGroups();

    return;

  }


  /*
    ROUND2
    24 → 12
  */

  if (round === 2) {

    round = 3;

    createGroups();

    return;

  }


  /*
    FINAL
    12 → 9
  */

  if (round === 3) {

    showResult();

    return;

  }

}


/* =====================================
   RESULT
===================================== */

function showResult() {

  document
    .getElementById("gameScreen")
    .classList.remove("active");

  document
    .getElementById("resultScreen")
    .classList.add("active");


  const resultList =
    document.getElementById(
      "resultList"
    );


  resultList.innerHTML = "";


  currentPool.forEach(
    (member, index) => {

      const item =
        document.createElement("div");

      item.className =
        "result-item";


      item.innerHTML = `

        <div class="result-number">
          ${index + 1}
        </div>

        <div class="result-photo">
          ${member.name.charAt(0)}
        </div>

        <div>

          <div class="result-name">
            ${member.name}
          </div>

          <div class="result-gen">
            ${member.gen}
          </div>

        </div>

      `;


      resultList
        .appendChild(item);

    }
  );

}

</script>

</body>
</html>
