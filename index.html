<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMD SUKIGAO 9</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fff9fc;
  color: #30252d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 30px 18px 50px;
}

.card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 30px;
  padding: 30px 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(170, 90, 130, 0.08);
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.small-title {
  color: #a36b88;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 3px;
}

h1 {
  margin: 12px 0 0;
  font-size: 34px;
  line-height: 1.25;
}

.subtitle {
  margin-top: 20px;
  line-height: 1.8;
  font-weight: bold;
}

.heart {
  color: #e98ab5;
}

.start-button,
.next-button,
.retry-button {
  width: 100%;
  margin-top: 28px;
  padding: 17px;
  border: none;
  border-radius: 18px;
  background: #b84f87;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.start-button:active,
.next-button:active,
.retry-button:active {
  transform: scale(0.98);
}

.progress {
  color: #a36b88;
  font-size: 14px;
  margin-bottom: 8px;
}

.question {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.members {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.member {
  border: 3px solid transparent;
  background: white;
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
  cursor: pointer;
  transition: 0.15s;
}

.member.selected {
  border-color: #e98ab5;
  background: #fff0f7;
  transform: scale(0.97);
}

.photo {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 15px;
  background: linear-gradient(135deg, #f1e7ed, #e4d5de);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-size: 35px;
  font-weight: bold;
}

.member-name {
  margin-top: 9px;
  font-weight: bold;
  font-size: 17px;
}

.member-gen {
  margin-top: 3px;
  color: #999;
  font-size: 12px;
}

/* =========================
   FINAL 9 GRID
========================= */

.final-grid {
  margin-top: 25px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.final-card {
  background: white;
  border: 1px solid #ead8e3;
  border-radius: 17px;
  padding: 8px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
}

.final-photo {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 13px;
  background: linear-gradient(135deg, #f1e7ed, #e4d5de);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a36b88;
  font-size: 25px;
  font-weight: bold;
}

.final-number {
  color: #a36b88;
  font-size: 12px;
  font-weight: bold;
  margin-top: 6px;
}

.final-name {
  font-weight: bold;
  font-size: 14px;
  margin-top: 3px;
  word-break: break-word;
}

.final-gen {
  color: #999;
  font-size: 10px;
  margin-top: 2px;
}

.note {
  color: #aaa0a6;
  font-size: 12px;
  margin-top: 20px;
  line-height: 1.7;
}

</style>
</head>


<body>

<main class="container">


<!-- =========================
     START SCREEN
========================= -->

<section id="startScreen" class="card screen active">

  <div class="small-title">
    DMD SUKIGAO 9
  </div>

  <h1>
    DMD<br>
    好き顔9選メーカー
  </h1>

  <div class="subtitle">
    DMDメンバーから<br>
    「顔が好き」9人を決めよう
    <span class="heart">💗</span>
  </div>

  <div class="note">
    推しランキングじゃなくて、<br>
    顔だけで直感勝負！
  </div>

  <button
    class="start-button"
    onclick="startGame()">
    はじめる 💗
  </button>

</section>


<!-- =========================
     GAME SCREEN
========================= -->

<section id="gameScreen" class="card screen">

  <div
    id="progress"
    class="progress">
  </div>

  <div
    id="question"
    class="question">
  </div>

  <div
    id="members"
    class="members">
  </div>

  <button
    id="nextButton"
    class="next-button"
    onclick="confirmSelection()"
    style="display:none;">
    決定 💗
  </button>

</section>


<!-- =========================
     RESULT SCREEN
========================= -->

<section id="resultScreen" class="card screen">

  <div class="small-title">
    DMD SUKIGAO 9
  </div>

  <h1>
    好き顔9 💗
  </h1>

  <div class="subtitle">
    あなたが選び抜いた9人！
  </div>

  <div
    id="resultGrid"
    class="final-grid">
  </div>

  <button
    class="retry-button"
    onclick="startGame()">
    もう一回やる
  </button>

</section>


</main>

/* ==========================================
   GAME VARIABLES
========================================== */

let currentPool = [];

let nextPool = [];

let groups = [];

let groupIndex = 0;

let selected = [];

let round = 1;


/* ==========================================
   SHUFFLE
========================================== */

function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;
}


/* ==========================================
   START GAME
========================================== */

function startGame() {

  currentPool =
    shuffle(members);

  nextPool = [];

  groups = [];

  groupIndex = 0;

  selected = [];

  round = 1;


  document
    .getElementById("startScreen")
    .classList
    .remove("active");


  document
    .getElementById("resultScreen")
    .classList
    .remove("active");


  document
    .getElementById("gameScreen")
    .classList
    .add("active");


  createRound1();

}


/* ==========================================
   ROUND 1
   47 → 24

   4人 → 2人
========================================== */

function createRound1() {

  groups = [];

  const shuffled =
    shuffle(currentPool);


  /*
    44人を4人ずつ
    11グループ
  */

  for (
    let i = 0;
    i < 44;
    i += 4
  ) {

    groups.push(
      shuffled.slice(
        i,
        i + 4
      )
    );

  }


  /*
    最後の3人
  */

  groups.push(
    shuffled.slice(
      44,
      47
    )
  );


  groupIndex = 0;

  showGroup();

}


/* ==========================================
   ROUND 2
   24 → 12

   4人 → 2人
========================================== */

function createRound2() {

  groups = [];

  const shuffled =
    shuffle(currentPool);


  for (
    let i = 0;
    i < 24;
    i += 4
  ) {

    groups.push(
      shuffled.slice(
        i,
        i + 4
      )
    );

  }


  groupIndex = 0;

  showGroup();

}


/* ==========================================
   ROUND 3
   12 → 9

   2人 → 1人
   を3回

   残り6人はそのまま通過
========================================== */

function createRound3() {

  groups = [];

  const shuffled =
    shuffle(currentPool);


  /*
    最初の6人
    → 3つの2人対決
  */

  for (
    let i = 0;
    i < 6;
    i += 2
  ) {

    groups.push(
      shuffled.slice(
        i,
        i + 2
      )
    );

  }


  /*
    残り6人は
    そのまま最終9人へ
  */

  nextPool =
    shuffled.slice(6);


  groupIndex = 0;

  showGroup();

}


/* ==========================================
   SHOW GROUP
========================================== */

function showGroup() {

  selected = [];


  const group =
    groups[groupIndex];


  const membersArea =
    document.getElementById(
      "members"
    );


  membersArea.innerHTML = "";


  document
    .getElementById("nextButton")
    .style.display = "none";


  /*
    必要選択人数
  */

  let required;


  if (round === 3) {

    required = 1;

  } else {

    required = 2;

  }


  /*
    表示
  */

  document
    .getElementById("progress")
    .textContent =
      `ROUND ${round}　${groupIndex + 1} / ${groups.length}`;


  document
    .getElementById("question")
    .textContent =
      `この${group.length}人から好きな${required}人を選んでね♡`;


  /*
    メンバーカード
  */

  group.forEach(
    (member, index) => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "member";


      element.onclick =
        function() {

          toggleMember(
            element,
            index
          );

        };


      element.innerHTML = `

        <div class="photo">
          ${member.name.charAt(0)}
        </div>

        <div class="member-name">
          ${member.name}
        </div>

        <div class="member-gen">
          ${member.gen}
        </div>

      `;


      membersArea.appendChild(
        element
      );

    }
  );

}


/* ==========================================
   MEMBER SELECT
========================================== */

function toggleMember(
  element,
  index
) {

  const required =
    round === 3
      ? 1
      : 2;


  /*
    すでに選択中
  */

  if (
    selected.includes(index)
  ) {

    selected =
      selected.filter(
        i => i !== index
      );


    element
      .classList
      .remove("selected");

  }


  /*
    新しく選択
  */

  else {

    /*
      選べる人数を超えたら
      選択できない
    */

    if (
      selected.length >= required
    ) {

      return;

    }


    selected.push(index);


    element
      .classList
      .add("selected");

  }


  /*
    決定ボタン表示
  */

  document
    .getElementById("nextButton")
    .style.display =
      selected.length === required
        ? "block"
        : "none";

}


/* ==========================================
   CONFIRM
========================================== */

function confirmSelection() {

  const group =
    groups[groupIndex];


  /*
    選んだメンバーを
    次のプールへ
  */

  selected.forEach(
    index => {

      nextPool.push(
        group[index]
      );

    }
  );


  groupIndex++;


  /*
    まだグループが残っている
  */

  if (
    groupIndex < groups.length
  ) {

    showGroup();

    return;

  }


  /* ========================================
     ROUND 1 END
     47 → 24
  ======================================== */

  if (
    round === 1
  ) {

    currentPool =
      nextPool;

    nextPool = [];

    round = 2;

    createRound2();

    return;

  }


  /* ========================================
     ROUND 2 END
     24 → 12
  ======================================== */

  if (
    round === 2
  ) {

    currentPool =
      nextPool;

    nextPool = [];

    round = 3;

    createRound3();

    return;

  }


  /* ========================================
     ROUND 3 END
     12 → 9
  ======================================== */

  if (
    round === 3
  ) {

    /*
      nextPoolには

      ・対決勝者 3人
      ・自動通過 6人

      合計9人
    */

    currentPool =
      nextPool;

    nextPool = [];

    showResult();

    return;

  }

}


/* ==========================================
   FINAL RESULT
========================================== */

function showResult() {

  document
    .getElementById("gameScreen")
    .classList
    .remove("active");


  document
    .getElementById("resultScreen")
    .classList
    .add("active");


  const grid =
    document.getElementById(
      "resultGrid"
    );


  grid.innerHTML = "";


  /*
    最終9人の番号配置

      4 5 6
      2 1 3
      7 8 9

    配列の順番は

      1 = 真ん中
      2 = 左
      3 = 右
      4 = 左上
      5 = 上
      6 = 右上
      7 = 左下
      8 = 下
      9 = 右下
  */

  const positions = [

    currentPool[3],  /* 4 */
    currentPool[4],  /* 5 */
    currentPool[5],  /* 6 */

    currentPool[1],  /* 2 */
    currentPool[0],  /* 1 */
    currentPool[2],  /* 3 */

    currentPool[6],  /* 7 */
    currentPool[7],  /* 8 */
    currentPool[8]   /* 9 */

  ];


  const numbers = [
    4, 5, 6,
    2, 1, 3,
    7, 8, 9
  ];


  positions.forEach(
    (member, index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "final-card";


      card.innerHTML = `

        <div class="final-photo">
          ${member.name.charAt(0)}
        </div>

        <div class="final-number">
          ${numbers[index]}
        </div>

        <div class="final-name">
          ${member.name}
        </div>

        <div class="final-gen">
          ${member.gen}
        </div>

      `;


      grid.appendChild(
        card
      );

    }
  );

}

</script>
